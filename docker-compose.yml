services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gt4
    ports:
      - "5432:5432"
  
  app:
    build: .
    environment:
      - MIGRATE_PATH=migrations
      - DB_DSN=postgres://user:password@db:5432/gt4?sslmode=disable
      - AUTH_DSN=auth:9091
    ports:
      - "8081:8081"
    volumes:
      - "./migrations:/root/migrations"
    depends_on:
      - db
      - auth
  
  auth:
    build: 
      context: C:\Users\magnu\OneDrive\Documentos\projects\gt4-authservice
      dockerfile: Dockerfile
    environment:
      - DB_DSN=postgres://user:password@db:5432/gt4?sslmode=disable
      - SRV_PORT=9091
    ports:
      - "9091:9091"
    depends_on:
      - db